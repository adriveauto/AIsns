<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="sky" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#2C3474"/>
      <stop offset="1" stop-color="#151A3E"/>
    </radialGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0B84A" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#F0B84A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFE3A3"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="40" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#FFF4E0">
    <circle cx="30" cy="34" r="1.6"/><circle cx="62" cy="20" r="1.1"/><circle cx="200" cy="30" r="1.8"/>
    <circle cx="214" cy="78" r="1.2"/><circle cx="22" cy="96" r="1.2"/><circle cx="178" cy="14" r="1"/>
    <circle cx="112" cy="16" r="1.3"/>
  </g>
  <!-- comet trail flowing from the mane -->
  <path d="M8 70 C 50 64, 86 70, 116 84 L 112 96 C 84 86, 48 80, 8 86 Z" fill="url(#tail)"/>
  <!-- little globe -->
  <circle cx="128" cy="218" r="62" fill="#3E7F8F"/>
  <path d="M86 186 q16 -10 30 0 t28 -2 q10 8 4 16 q-16 6 -26 -2 t-36 -4 z" fill="#7FD1B9"/>
  <path d="M150 168 q14 -4 22 6 q-4 10 -16 8 q-10 -4 -6 -14 z" fill="#7FD1B9"/>
  <!-- speech bubbles orbiting, different shapes for different tongues -->
  <g>
    <rect x="22" y="128" width="34" height="22" rx="11" fill="#F07A5A"/>
    <path d="M30 148 l-4 10 l12 -8 z" fill="#F07A5A"/>
    <circle cx="31" cy="139" r="2.4" fill="#FFF4E0"/><circle cx="39" cy="139" r="2.4" fill="#FFF4E0"/><circle cx="47" cy="139" r="2.4" fill="#FFF4E0"/>
  </g>
  <g transform="translate(6 48)">
    <path d="M186 106 h30 a6 6 0 0 1 6 6 v14 a6 6 0 0 1 -6 6 h-18 l-8 8 v-8 h-4 a6 6 0 0 1 -6 -6 v-14 a6 6 0 0 1 6 -6 z" fill="#7FD1B9"/>
    <path d="M194 119 q6 -6 12 0 t12 0" fill="none" stroke="#151A3E" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g>
    <ellipse cx="196" cy="56" rx="18" ry="13" fill="#FFF4E0"/>
    <path d="M186 66 l-6 9 l13 -6 z" fill="#FFF4E0"/>
    <path d="M190 55 l5 5 l9 -10" fill="none" stroke="#F07A5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- the foal, mid-leap -->
  <g>
    <!-- back legs -->
    <path d="M94 142 q-14 12 -26 22" stroke="#E9DCC6" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M104 146 q-4 16 -16 26" stroke="#F6EBD8" stroke-width="9" stroke-linecap="round" fill="none"/>
    <circle cx="68" cy="164" r="5" fill="#151A3E"/><circle cx="88" cy="172" r="5" fill="#151A3E"/>
    <!-- front legs -->
    <path d="M140 140 q14 4 22 -6" stroke="#E9DCC6" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M132 146 q12 12 26 10" stroke="#F6EBD8" stroke-width="9" stroke-linecap="round" fill="none"/>
    <circle cx="162" cy="134" r="5" fill="#151A3E"/><circle cx="158" cy="156" r="5" fill="#151A3E"/>
    <!-- body -->
    <ellipse cx="118" cy="132" rx="34" ry="21" fill="#F6EBD8"/>
    <!-- tail: a little comet -->
    <path d="M86 124 q-22 -6 -30 10 q14 -4 24 4 z" fill="#F0B84A"/>
    <!-- neck and head -->
    <path d="M132 122 q4 -26 20 -36 l16 10 q-10 12 -14 34 z" fill="#F6EBD8"/>
    <path d="M150 82 q20 -6 32 8 q6 8 0 16 q-6 6 -16 4 l-20 -6 z" fill="#F6EBD8"/>
    <ellipse cx="178" cy="104" rx="7" ry="5" fill="#EBC9B4"/>
    <circle cx="176" cy="103" r="1.4" fill="#151A3E"/>
    <!-- ears -->
    <path d="M154 82 l2 -16 l9 13 z" fill="#F6EBD8"/>
    <path d="M156 79 l1.5 -9 l5 7 z" fill="#EBC9B4"/>
    <!-- big curious eye -->
    <circle cx="164" cy="92" r="5.4" fill="#151A3E"/>
    <circle cx="166" cy="90" r="1.8" fill="#FFF4E0"/>
    <!-- mane: shooting star -->
    <path d="M148 84 q-14 -2 -30 4 q14 4 22 12 q-12 2 -20 10 q16 -2 28 2 z" fill="#F0B84A"/>
    <path d="M112 88 l3.5 -7 l3.5 7 l7.5 1 l-5.5 5 l1.5 7.5 l-7 -3.6 l-7 3.6 l1.5 -7.5 l-5.5 -5 z" fill="#FFE3A3"/>
    <!-- lantern held in the mouth -->
    <path d="M184 108 q6 6 4 14" stroke="#151A3E" stroke-width="2" fill="none"/>
    <rect x="181" y="121" width="14" height="18" rx="4" fill="#F0B84A"/>
    <rect x="184" y="125" width="8" height="10" rx="2" fill="#FFF4E0"/>
    <rect x="183" y="118" width="10" height="4" rx="2" fill="#151A3E"/>
  </g>
  <!-- glow of the lantern -->
  <circle cx="188" cy="130" r="20" fill="#F0B84A" opacity="0.18"/>
</svg>
